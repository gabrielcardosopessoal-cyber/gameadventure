<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>As Aventuras de Léo e sua Coca-Cola</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; background: #000; margin: 0 auto; }
        
        /* UI de Pontos */
        #ui { 
            position: absolute; width: 100%; top: 20px; display: none; 
            justify-content: space-around; color: #fff; font-weight: bold;
            pointer-events: none; font-size: 18px; z-index: 10;
            text-shadow: 0 0 10px #ff00e5, 0 0 20px #ff00e5;
        }

        /* Menu Inicial */
        #menu {
            position: absolute; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; text-align: center;
        }

        h1 {
            color: #fff; font-size: 40px; margin-bottom: 30px;
            text-shadow: 0 0 10px #ff00e5, 0 0 20px #ff00e5, 0 0 40px #ff00e5;
            padding: 0 20px;
        }

        .btn-play {
            padding: 15px 40px; font-size: 24px; color: #00fbff;
            background: transparent; border: 3px solid #00fbff;
            cursor: pointer; border-radius: 50px; font-weight: bold;
            text-transform: uppercase; transition: 0.3s;
            box-shadow: 0 0 15px #00fbff;
        }

        .btn-play:hover {
            background: #00fbff; color: #000;
            box-shadow: 0 0 30px #00fbff;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>AS AVENTURAS DE LÉO<br><span style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">E SUA COCA-COLA</span></h1>
        <button class="btn-play" onclick="startGame()">Iniciar Aventura</button>
    </div>

    <div id="ui">
        <div>Metros: <span id="dist">0</span></div>
        <div>Pontos: <span id="score">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const distElement = document.getElementById('dist');
const menu = document.getElementById('menu');
const ui = document.getElementById('ui');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- ÁUDIOS ---
const musica = new Audio('fundo.mp3'); 
musica.loop = true;
const somMoeda = new Audio('som moedas.mp3'); 

let gameRunning = false;
let musicaIniciada = false;

// --- PERSONAGEM ---
const player = {
    x: 100, y: 0, width: 80, height: 80,
    dy: 0, jumpForce: 16, gravity: 0.6,
    grounded: false, img: new Image()
};
player.img.src = 'WhatsApp Image 2026-05-03 at 19.41.17.jpeg';

let score = 0, distance = 0, gameSpeed = 6.5, frames = 0, gameOver = false;
let platforms = [], items = [];

function startGame() {
    menu.style.display = 'none';
    ui.style.display = 'flex';
    gameRunning = true;
    
    // Inicia música (Mobile Safe)
    if (!musicaIniciada) {
        musica.play().catch(e => console.log("Erro áudio:", e));
        musicaIniciada = true;
    }
    init();
    update();
}

class Platform {
    constructor(x, y, width, color) {
        this.x = x; this.y = y; this.width = width; this.height = 35; this.color = color;
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 15; ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.restore();
    }
    update() { this.x -= gameSpeed; }
}

class Coin {
    constructor(x, y) {
        this.x = x; this.y = y; this.size = 14; this.angle = 0;
    }
    draw() {
        this.angle += 0.15;
        ctx.save();
        ctx.shadowBlur = 10; ctx.shadowColor = "#ffd700";
        ctx.fillStyle = "#FFD700";
        let w = Math.cos(this.angle) * this.size;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, Math.abs(w), this.size, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    update() { this.x -= gameSpeed; }
}

function init() {
    platforms = [new Platform(0, canvas.height - 150, canvas.width + 100, "#00fbff")];
    items = []; score = 0; distance = 0; gameSpeed = 6.5; gameOver = false;
    player.y = canvas.height - 300; player.dy = 0; frames = 0;
}

function spawnLogic() {
    let lastP = platforms[platforms.length - 1];
    if (lastP.x + lastP.width < canvas.width + 300) {
        let gap = 130 + Math.random() * 100; 
        let newX = lastP.x + lastP.width + gap;
        let newY = Math.max(200, Math.min(canvas.height - 150, lastP.y + (Math.random() * 200 - 100)));
        let newWidth = 300 + Math.random() * 300;
        platforms.push(new Platform(newX, newY, newWidth, "#ff00e5"));
        if (Math.random() > 0.4) items.push(new Coin(newX + newWidth/2, newY - 50));
    }
}

function update() {
    if (!gameRunning) return;
    if (gameOver) {
        menu.style.display = 'flex';
        document.querySelector('h1').innerHTML = "FIM DE JOGO!<br><span style='font-size:20px'>Pontos: "+score+"</span>";
        document.querySelector('.btn-play').innerText = "Tentar Novamente";
        gameRunning = false;
        return;
    }

    frames++;
    distance = Math.floor(frames / 10);
    distElement.innerText = distance;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    player.dy += player.gravity;
    player.y += player.dy;
    player.grounded = false;

    platforms.forEach((p, i) => {
        p.update(); p.draw();
        if (player.x + player.width * 0.7 > p.x && player.x + player.width * 0.3 < p.x + p.width && 
            player.y + player.height > p.y && player.y + player.height < p.y + p.height + player.dy + 5) {
            if (player.dy >= 0) { player.grounded = true; player.dy = 0; player.y = p.y - player.height; }
        }
        if (p.x + p.width < -500) platforms.splice(i, 1);
    });

    items.forEach((coin, i) => {
        coin.update(); coin.draw();
        let dx = (player.x + player.width/2) - coin.x;
        let dy = (player.y + player.height/2) - coin.y;
        if (Math.sqrt(dx*dx + dy*dy) < 55) { 
            items.splice(i, 1); score += 10; scoreElement.innerText = score;
            somMoeda.currentTime = 0;
            somMoeda.play().catch(() => {}); 
        }
    });

    ctx.drawImage(player.img, player.x, player.y, player.width, player.height);
    if (player.y > canvas.height + 100) gameOver = true;

    spawnLogic();
    requestAnimationFrame(update);
}

function handleInput(e) {
    if (e && e.cancelable) e.preventDefault();
    if (gameRunning && player.grounded) {
        player.dy = -player.jumpForce;
        player.grounded = false;
    }
}

window.addEventListener('keydown', (e) => { if(e.code === 'Space') handleInput(e); });
canvas.addEventListener('mousedown', handleInput);
canvas.addEventListener('touchstart', handleInput, { passive: false });

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
