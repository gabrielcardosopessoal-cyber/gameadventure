<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Léo & Coca-Cola: Night City</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #0a0a12; /* Fundo escuro confortável */
            font-family: 'Segoe UI', sans-serif; 
            touch-action: none; 
        }
        canvas { display: block; margin: 0 auto; }
        
        #ui { 
            position: absolute; width: 100%; top: 20px; display: none; 
            justify-content: space-around; color: #00fbff; font-weight: bold;
            pointer-events: none; font-size: 20px; z-index: 10;
            text-shadow: 0 0 8px rgba(0, 251, 255, 0.5);
        }

        #menu {
            position: absolute; width: 100%; height: 100%;
            background: rgba(10, 10, 18, 0.9);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; text-align: center;
        }

        h1 {
            color: #fff; font-size: clamp(24px, 8vw, 45px); margin-bottom: 30px;
            text-shadow: 0 0 15px #ff00e5;
            padding: 0 20px;
        }

        .btn-play {
            padding: 15px 40px; font-size: 22px; color: #fff;
            background: transparent; border: 2px solid #00fbff;
            cursor: pointer; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; box-shadow: 0 0 15px rgba(0,251,255,0.3);
            transition: 0.3s;
        }

        .btn-play:hover { background: #00fbff; color: #000; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>LÉO E A COCA-COLA<br>
            <span style="color: #ff3333; font-size: 0.7em;">NIGHT ADVENTURE</span>
        </h1>
        <button class="btn-play" onclick="startGame()">Iniciar</button>
    </div>

    <div id="ui">
        <div>DISTÂNCIA: <span id="dist">0</span>m</div>
        <div>PONTOS: <span id="score">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const distElement = document.getElementById('dist');
const menu = document.getElementById('menu');
const ui = document.getElementById('ui');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- ATIVOS ---
const musica = new Audio('fundo.mp3'); 
musica.loop = true;
const somMoeda = new Audio('som moedas.mp3'); 

const player = {
    x: 100, y: 0, width: 70, height: 70,
    dy: 0, jumpForce: 15, gravity: 0.6,
    grounded: false, img: new Image()
};
player.img.src = 'leo.png';

let gameRunning = false, musicaIniciada = false, gameOver = false;
let score = 0, frames = 0, gameSpeed = 6;
let platforms = [], items = [], buildings = [];

// --- GERADOR DE CIDADE REALISTA ---
function createBuildings() {
    buildings = [];
    for(let i = 0; i < 15; i++) {
        buildings.push({
            x: Math.random() * canvas.width * 2,
            width: 80 + Math.random() * 120,
            height: 150 + Math.random() * 400,
            speed: 0.5 + Math.random() * 1.5,
            color: '#1a1a2e',
            windows: Array.from({length: 12}, () => Math.random() > 0.7)
        });
    }
}

function drawCity() {
    buildings.forEach(b => {
        // Corpo do prédio
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, canvas.height - b.height, b.width, b.height);
        
        // Janelas iluminadas
        ctx.fillStyle = "#f1c40f55";
        let winW = 8, winH = 8;
        for(let row = 0; row < 10; row++) {
            for(let col = 0; col < 3; col++) {
                if(b.windows[row]) {
                    ctx.fillRect(b.x + 15 + (col * 30), canvas.height - b.height + 20 + (row * 35), winW, winH);
                }
            }
        }
        
        if(gameRunning) b.x -= b.speed;
        if(b.x + b.width < 0) b.x = canvas.width + 100;
    });
}

// --- LÓGICA DO JOGO ---
class Platform {
    constructor(x, y, width) {
        this.x = x; this.y = y; this.width = width; this.height = 30;
    }
    draw() {
        // Base da viga
        let grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.height);
        grad.addColorStop(0, "#2c3e50");
        grad.addColorStop(1, "#000000");
        ctx.fillStyle = grad;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        // Brilho Neon na borda
        ctx.strokeStyle = "#00fbff";
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x, this.y, this.width, this.height);
    }
    update() { this.x -= gameSpeed; }
}

class Coin {
    constructor(x, y) {
        this.x = x; this.y = y; this.radius = 12;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
        ctx.fillStyle = "#FFD700";
        ctx.shadowBlur = 15; ctx.shadowColor = "#FFD700";
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    update() { this.x -= gameSpeed; }
}

function startGame() {
    menu.style.display = 'none';
    ui.style.display = 'flex';
    gameRunning = true;
    if (!musicaIniciada) {
        musica.play().catch(e => {});
        musicaIniciada = true;
    }
    init();
    update();
}

function init() {
    createBuildings();
    platforms = [new Platform(0, canvas.height - 120, canvas.width + 200)];
    items = []; score = 0; gameSpeed = 6; gameOver = false; frames = 0;
    player.y = canvas.height - 300; player.dy = 0;
}

function update() {
    if (!gameRunning) return;
    if (gameOver) {
        menu.style.display = 'flex';
        document.querySelector('h1').innerHTML = "FIM DE JOGO<br><span style='font-size:20px; color:#00fbff'>"+score+" PONTOS</span>";
        gameRunning = false;
        return;
    }

    frames++;
    distElement.innerText = Math.floor(frames/10);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawCity();

    // Player
    player.dy += player.gravity;
    player.y += player.dy;
    player.grounded = false;

    platforms.forEach((p, i) => {
        p.update(); p.draw();
        if (player.x + 50 > p.x && player.x + 20 < p.x + p.width && 
            player.y + player.height > p.y && player.y + player.height < p.y + p.height + player.dy + 5) {
            if (player.dy >= 0) { player.grounded = true; player.dy = 0; player.y = p.y - player.height; }
        }
        if (p.x + p.width < -100) platforms.splice(i, 1);
    });

    items.forEach((coin, i) => {
        coin.update(); coin.draw();
        let dx = (player.x + 35) - coin.x;
        let dy = (player.y + 35) - coin.y;
        if (Math.sqrt(dx*dx + dy*dy) < 45) { 
            items.splice(i, 1); score += 10; scoreElement.innerText = score;
            somMoeda.currentTime = 0; somMoeda.play().catch(() => {});
            gameSpeed += 0.05;
        }
    });

    // Spawn inteligente
    let lastP = platforms[platforms.length - 1];
    if (lastP.x + lastP.width < canvas.width + 200) {
        let newX = lastP.x + lastP.width + (100 + Math.random() * 120);
        let newY = Math.max(180, Math.min(canvas.height - 100, lastP.y + (Math.random() * 140 - 70)));
        platforms.push(new Platform(newX, newY, 250 + Math.random() * 200));
        if (Math.random() > 0.5) items.push(new Coin(newX + 100, newY - 40));
    }

    ctx.drawImage(player.img, player.x, player.y, player.width, player.height);
    if (player.y > canvas.height) gameOver = true;

    requestAnimationFrame(update);
}

function handleInput(e) {
    if (e && e.cancelable) e.preventDefault();
    if (gameRunning && player.grounded) {
        player.dy = -player.jumpForce;
        player.grounded = false;
    }
}

window.addEventListener('keydown', (e) => { if(e.code === 'Space') handleInput(e); });
canvas.addEventListener('touchstart', handleInput, { passive: false });
canvas.addEventListener('mousedown', handleInput);

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    createBuildings();
});
</script>
</body>
</html>
