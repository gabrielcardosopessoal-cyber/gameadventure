<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Runner Pro - Mega Size & Touch Support</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; background: #000; margin: 0 auto; }
        #ui { 
            position: absolute; width: 100%; top: 25px; display: flex; 
            justify-content: space-around; color: white; font-weight: bold;
            pointer-events: none; font-size: 22px; letter-spacing: 2px;
            text-transform: uppercase; z-index: 10;
        }
        .score-box { text-shadow: 0 0 15px rgba(255,255,255,0.7); }
    </style>
</head>
<body>

    <div id="ui">
        <div class="score-box">Distância: <span id="dist">0</span>m</div>
        <div class="score-box">Pontos: <span id="score">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const distElement = document.getElementById('dist');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- CONFIGURAÇÃO DE ÁUDIO ---
const musica = new Audio();
musica.src = 'SUA_MUSICA.mp3'; 
musica.loop = true;

const somMoeda = new Audio();
somMoeda.src = 'SOM_MOEDA.mp3'; 

let musicaIniciada = false;

// --- CONFIGURAÇÃO DO PERSONAGEM (MEGA: 220px) ---
const player = {
    x: 80,
    y: 100,
    width: 220, 
    height: 220,
    dy: 0,
    jumpForce: 20, 
    gravity: 0.75, 
    grounded: false,
    img: new Image()
};

player.img.src = 'WhatsApp Image 2026-05-03 at 19.41.17.jpeg';

let score = 0;
let distance = 0;
let gameSpeed = 10; 
let platforms = [];
let items = [];
let frames = 0;
let gameOver = false;

class Platform {
    constructor(x, y, width, color) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = 55; 
        this.color = color;
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 25;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
        ctx.fillRect(this.x, this.y, this.width, 10);
        ctx.restore();
    }
    update() {
        this.x -= gameSpeed;
    }
}

class Coin {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = 25; 
        this.angle = 0;
    }
    draw() {
        this.angle += 0.15;
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#FFD700";
        ctx.fillStyle = "#FFD700";
        let width = Math.cos(this.angle) * this.size;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, Math.abs(width), this.size, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    update() {
        this.x -= gameSpeed;
    }
}

function init() {
    platforms = [
        new Platform(50, canvas.height - 200, 1000, "#00FBFF") 
    ];
    items = [];
    score = 0;
    distance = 0;
    gameSpeed = 10;
    gameOver = false;
    player.y = canvas.height - 550;
    player.dy = 0;
    frames = 0;
}

function spawnLogic() {
    if (frames % 40 === 0) {
        let lastP = platforms[platforms.length - 1];
        if (lastP.x < canvas.width - 50) {
            let colors = ["#00FBFF", "#FF00E5", "#39FF14", "#FFD700", "#FF4500"];
            let gap = 200 + (Math.random() * 150);
            let newX = lastP.x + lastP.width + gap;
            let minY = Math.max(300, lastP.y - 180);
            let maxY = Math.min(canvas.height - 120, lastP.y + 180);
            let newY = minY + Math.random() * (maxY - minY);
            let newWidth = 500 + Math.random() * 500;
            
            platforms.push(new Platform(newX, newY, newWidth, colors[Math.floor(Math.random()*colors.length)]));
            
            if (Math.random() > 0.4) {
                items.push(new Coin(newX + newWidth/2, newY - 80));
            }
        }
    }
}

function update() {
    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.9)';
        ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = "center";
        ctx.font = 'bold 40px Segoe UI';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
        ctx.font = '20px Segoe UI';
        ctx.fillText('Toque ou pressione ESPAÇO para reiniciar', canvas.width/2, canvas.height/2 + 60);
        return;
    }

    frames++;
    distance = Math.floor(frames / 5);
    distElement.innerText = distance;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    player.dy += player.gravity;
    player.y += player.dy;
    player.grounded = false;

    platforms.forEach((p, i) => {
        p.update();
        p.draw();
        if (player.x + player.width*0.7 > p.x && 
            player.x + player.width*0.3 < p.x + p.width && 
            player.y + player.height > p.y && 
            player.y + player.height < p.y + p.height + player.dy) {
            player.grounded = true;
            player.dy = 0;
            player.y = p.y - player.height;
        }
        if (p.x + p.width < -500) platforms.splice(i, 1);
    });

    items.forEach((coin, i) => {
        coin.update();
        coin.draw();
        let dx = (player.x + player.width/2) - coin.x;
        let dy = (player.y + player.height/2) - coin.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < 120) { 
            items.splice(i, 1);
            score += 100;
            scoreElement.innerText = score;
            gameSpeed += 0.05;
            somMoeda.currentTime = 0;
            somMoeda.play().catch(e => {}); 
        }
    });

    ctx.drawImage(player.img, player.x, player.y, player.width, player.height);

    if (player.y > canvas.height) gameOver = true;

    spawnLogic();
    requestAnimationFrame(update);
}

function handleInput(e) {
    if (e) e.preventDefault(); // Evita comportamentos estranhos no mobile

    if (!musicaIniciada) {
        musica.play().catch(e => {});
        musicaIniciada = true;
    }

    if (gameOver) {
        init();
        update();
    } else if (player.grounded) {
        player.dy = -player.jumpForce;
        player.grounded = false;
    }
}

// CONTROLES TECLADO
window.addEventListener('keydown', (e) => { 
    if(e.code === 'Space' || e.code === 'ArrowUp') {
        handleInput(e);
    }
});

// CONTROLES MOUSE
canvas.addEventListener('mousedown', (e) => handleInput(e));

// CONTROLES TOUCH SCREEN (CELULAR)
canvas.addEventListener('touchstart', (e) => {
    handleInput(e);
}, { passive: false });

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

init();
update();
</script>
</body>
</html>
